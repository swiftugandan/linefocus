name: Check, test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Unit, physics and oracle tests
        run: npm test
      - name: Build the site
        run: npm run build:pages
      - name: Browser tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet playwright==1.57.0
          .venv/bin/playwright install --with-deps chromium
          (npx --yes http-server@14.1.1 _site -p 8765 -s &) && sleep 2
          LINEFOCUS_URL=http://127.0.0.1:8765/app/ .venv/bin/python tests/browser_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
